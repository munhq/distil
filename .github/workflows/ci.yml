name: ci

on:
  push:
    branches: [main, measurement]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: format
        run: cargo fmt --all --check

      # Every binary is feature-gated, so a default-feature clippy run would
      # check almost nothing. --all-targets also covers examples, which is how
      # the README snippet stays honest.
      - name: clippy
        run: cargo clippy --all-targets --features "bench probe mcp metrics config" -- -D warnings

      - name: test
        run: cargo test --features "bench probe mcp metrics config"

      # The crate is meant to be usable without any feature. A dependency that
      # leaks into the default build would only show up here.
      - name: build with no features
        run: cargo build --no-default-features

  # Compilation and tests on the platforms the release publishes for. The
  # release builds six targets across three operating systems, and until this
  # ran, only Linux was ever proven — a Mac or Windows build could break for a
  # release and nothing would say so until someone downloaded the asset.
  platforms:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Windows runners default to PowerShell; every script step here is shell,
    # and bash ships on the Windows image.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build the shipped binaries
        run: |
          cargo build --release --features mcp --bin distil-mcp
          cargo build --release --features bench --bin distil-bench

      - name: test
        run: cargo test --features "bench probe mcp metrics config"

      # The plugin launcher and install.sh must ask for asset names the release
      # matrix really publishes. They did not on any Mac, and the mapping is
      # pure shell, so it is checked wherever bash runs.
      - name: installers must ask for assets the release publishes
        run: bash plugin/test_platform.sh

      # The install test stubs a release and a claude CLI on PATH and checks what
      # lands in an isolated HOME. Its stub PATH is POSIX, so it runs where that
      # holds; the mapping test above covers Windows.
      - name: install.sh must land the binary, the skill and the registration
        if: matrix.os != 'windows-latest'
        run: bash plugin/test_install.sh

  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [corpus, tiktoken, bench, proxy, mcp, probe, metrics, config, code-mode]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Feature combinations break one at a time and only in isolation; the
      # combined build above hides that.
      - run: cargo build --no-default-features --features ${{ matrix.feature }}
