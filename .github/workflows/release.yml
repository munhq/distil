name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.1)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Windows runners default to pwsh, and every script step here is bash. Git
    # Bash ships on the runner, so one default keeps the steps identical on all
    # three platforms instead of forking them.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl so the binary runs on any glibc, which is the whole point of
          # shipping one rather than asking for a toolchain.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            arch: x86_64
            plat: linux
            ext: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            arch: aarch64
            plat: linux
            ext: ""
          # plat is macos, not darwin. `uname -s` prints Darwin, so the scripts
          # translate; plugin/test_platform.sh holds them to these names, and
          # macos matches what codeindex publishes so both projects read alike.
          - target: x86_64-apple-darwin
            os: macos-latest
            arch: x86_64
            plat: macos
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            arch: aarch64
            plat: macos
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            arch: x86_64
            plat: windows
            ext: ".exe"
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            arch: aarch64
            plat: windows
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: install cross linker
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
            echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: build distil-mcp
        run: cargo build --release --locked --target ${{ matrix.target }} --features mcp --bin distil-mcp

      - name: build distil-bench
        run: cargo build --release --locked --target ${{ matrix.target }} --features bench --bin distil-bench

      # install.sh and the plugin launcher both resolve <binary>-<arch>-<plat>,
      # with .exe on Windows. The names must agree with the matrix above or an
      # install silently falls back to needing a toolchain, so the same triple
      # is asserted by plugin/test_platform.sh in CI.
      - name: stage artifacts
        run: |
          mkdir -p dist
          for bin in distil-mcp distil-bench; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}" \
               "dist/${bin}-${{ matrix.arch }}-${{ matrix.plat }}${{ matrix.ext }}"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staged
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The .mcpb bundle — what Smithery requires for a stdio release, and what
      # Claude Desktop installs with a double click. Built BEFORE the checksums,
      # so it is hashed with the binaries and cannot describe a version this
      # release does not contain. The tool list it declares is captured from the
      # binary being released rather than copied into a manifest that drifts.
      - name: bundle (.mcpb)
        run: |
          mkdir -p dist
          find staged -type f -exec cp {} dist/ \;
          chmod +x dist/distil-mcp-x86_64-linux
          node npm/capture-card.mjs --out card.json -- ./dist/distil-mcp-x86_64-linux
          VERSION=$(node -p "require('./npm/package.json').version")
          node npm/build-mcpb.mjs --card card.json --out "dist/distil-$VERSION.mcpb"

      - name: collect and checksum
        run: |
          cd dist && sha256sum * > checksums.txt
          cat checksums.txt

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
