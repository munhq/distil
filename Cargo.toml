[package]
name = "distil"
version = "0.1.0"
edition = "2024"
description = "Context optimization middleware for LLM agents — dynamic tool registry, result masking, token budgeting, and smart compaction"
license = "MIT OR Apache-2.0"
repository = "https://github.com/munhq/distil"
keywords = ["llm", "context", "tokens", "agents", "optimization"]
categories = ["text-processing", "algorithms"]
rust-version = "1.85"

[features]
default = []
# Enable accurate BPE tokenization via tiktoken (cl100k_base for GPT-4/Claude,
# model-specific for others). Without this feature, EstimateCounter is used.
tiktoken = ["dep:tiktoken-rs"]
# Enable the HTTP proxy binary (distil-proxy). Adds axum + reqwest.
proxy = ["dep:axum", "dep:tokio", "dep:reqwest", "dep:tower-http", "dep:tracing", "dep:tracing-subscriber", "dep:futures-util", "config"]
# Enable Prometheus metrics collection and /metrics endpoint.
metrics = ["dep:prometheus"]
# Enable TOML-based pipeline configuration.
config = ["dep:toml"]
# Enable Code Mode layer (JS sandbox for multi-tool chaining).
code-mode = ["dep:rquickjs"]
# Enable MCP (Model Context Protocol) server mode.
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]
# Enable the real-transcript corpus loader (no extra dependencies).
corpus = []
# Enable the distil-bench measurement binary. Needs accurate token counts.
bench = ["corpus", "tiktoken", "dep:rayon"]
# Enable the distil-probe retention harness. Needs a Summarizer (Ollama).
probe = ["corpus", "tiktoken", "proxy"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"

# tiktoken feature
tiktoken-rs = { version = "0.6", optional = true }

# bench feature (parallel corpus walk)
rayon = { version = "1", optional = true }

# metrics feature
prometheus = { version = "0.14", optional = true }

# config feature (TOML pipeline configuration)
toml = { version = "0.8", optional = true }

# code-mode feature (JS sandbox for tool chaining)
rquickjs = { version = "0.10", optional = true }

# mcp feature (MCP server mode)
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"], optional = true }
schemars = { version = "1", optional = true }

# proxy feature
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
reqwest = { version = "0.12", features = ["json", "blocking", "stream"], optional = true }
tower-http = { version = "0.6", features = ["trace", "cors"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
futures-util = { version = "0.3", optional = true }

[[bin]]
name = "distil-proxy"
path = "src/bin/proxy.rs"
required-features = ["proxy"]

[[bin]]
name = "distil-mcp"
path = "src/bin/mcp_server.rs"
required-features = ["mcp"]

[[bin]]
name = "distil-bench"
path = "src/bin/bench.rs"
required-features = ["bench"]

[[bin]]
name = "distil-probe"
path = "src/bin/probe_run.rs"
required-features = ["probe"]

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
# Strip at link time. The shipped binaries carry debug symbols nobody consuming a
# release can use, and every byte is a byte each install downloads.
strip = true
