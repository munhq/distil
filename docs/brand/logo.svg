<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" role="img" aria-label="distil">
  <title>distil</title>
  <defs>
    <linearGradient id="ds" x1="18" y1="122" x2="122" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect x="18" y="18" width="104" height="104" rx="28" fill="url(#ds)"/>
  <!-- The mark is icon.svg's paths verbatim, placed by a transform rather than
