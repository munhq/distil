<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="distil — cache writes are 2% of your tokens and 28% of your bill">
  <title>distil</title>
  <defs>
    <linearGradient id="tile" x1="80" y1="180" x2="180" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="hot" x1="700" y1="420" x2="1120" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a855f7"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <!-- GitHub renders these on both light and dark chrome, so the card carries
       its own ground rather than inheriting one. -->
  <rect width="1280" height="640" fill="#0b1020"/>

  <!-- The mark, from icon.svg by transform. 100/512 = 0.1953125 -->
  <rect x="80" y="72" width="100" height="100" rx="28" fill="url(#tile)"/>
  <g transform="translate(80 72) scale(0.1953125)">
    <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
      <g stroke-width="26" opacity="0.85">
        <path d="M170 96h172"/>
        <path d="M196 148h120"/>
      </g>
      <path stroke-width="30" d="M138 196h236l-90 134v42h-56v-42z"/>
      <path stroke-width="26" d="M256 398c16 20 26 30 26 42a26 26 0 0 1-52 0c0-12 10-22 26-42z"/>
    </g>
  </g>

  <g font-family="'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <text x="204" y="140" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#f6f8ff">distil</text>

    <!-- The inversion is the whole finding, so the two numbers are the card and
         everything else is a caption. The second is the surprising one, so it
         carries the colour; a reader's eye should land there second, not first. -->
    <text x="80"  y="410" font-size="200" font-weight="700" letter-spacing="-8" fill="#f6f8ff">2%</text>
    <text x="80"  y="470" font-size="34" font-weight="500" fill="#9aa4c4">of your tokens</text>

    <text x="700" y="410" font-size="200" font-weight="700" letter-spacing="-8" fill="url(#hot)">28%</text>
    <text x="700" y="470" font-size="34" font-weight="500" fill="#9aa4c4">of your bill</text>

    <text x="80" y="566" font-size="30" font-weight="400" fill="#6b7899">Cache writes. Measured over 13,814 real sessions.</text>
  </g>
</svg>
