<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="distil — you cannot compress your way out of context cost">
  <title>distil</title>
  <defs>
    <linearGradient id="tile" x1="80" y1="212" x2="212" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- GitHub renders these on both light and dark chrome, so the card carries
       its own ground rather than inheriting one. -->
  <rect width="1280" height="640" fill="#0b1020"/>

  <!-- The mark, from icon.svg by transform. 132/512 = 0.2578125 -->
  <rect x="80" y="80" width="132" height="132" rx="36" fill="url(#tile)"/>
  <g transform="translate(80 80) scale(0.2578125)">
    <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
      <g stroke-width="26" opacity="0.85">
        <path d="M170 96h172"/>
        <path d="M196 148h120"/>
      </g>
      <path stroke-width="30" d="M138 196h236l-90 134v42h-56v-42z"/>
      <path stroke-width="26" d="M256 398c16 20 26 30 26 42a26 26 0 0 1-52 0c0-12 10-22 26-42z"/>
    </g>
  </g>

  <g font-family="'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <text x="240" y="168" font-size="68" font-weight="700" letter-spacing="-2" fill="#f6f8ff">distil</text>

    <!-- One sentence, and it is the finding rather than a pitch. A link preview
         is read in about a second; a stat row, an install command and a licence
         string all compete with the only line that would make anyone click. -->
    <text x="80" y="372" font-size="62" font-weight="600" letter-spacing="-1.5" fill="#f6f8ff">You cannot compress your way</text>
    <text x="80" y="446" font-size="62" font-weight="600" letter-spacing="-1.5" fill="#f6f8ff">out of context cost.</text>
    <text x="80" y="524" font-size="38" font-weight="400" fill="#9aa4c4">You can only decline to admit tokens.</text>
  </g>
</svg>
