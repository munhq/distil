<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" role="img" aria-label="how much a rewrite must delete to break even">
  <title>how much a rewrite must delete to break even</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Carries its own ground: GitHub renders README images on both a white and
       a near-black page, and a transparent figure is illegible on one of them. -->
  <rect width="900" height="406" rx="14" fill="#0b1020"/>
  <g font-family="'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <text x="34" y="52" font-size="26" font-weight="600" fill="#f6f8ff">How much a rewrite must delete just to break even</text>
    <text x="34" y="80" font-size="16" font-weight="400" fill="#6b7899">Editing history turns cache reads at 0.1x into writes at 1.25x &#183; 5-minute TTL</text>
    <text x="34" y="128" font-size="17" fill="#9aa4c4">1 turn left</text>
    <rect x="200" y="112" width="45" height="22" rx="5" fill="url(#g)"/>
    <text x="259" y="129" font-size="17" font-weight="600" fill="#f6f8ff">8%</text>
    <text x="34" y="164" font-size="17" fill="#9aa4c4">2</text>
    <rect x="200" y="148" width="83" height="22" rx="5" fill="url(#g)"/>
    <text x="297" y="165" font-size="17" font-weight="600" fill="#f6f8ff">15%</text>
    <text x="34" y="200" font-size="17" fill="#9aa4c4">5</text>
    <rect x="200" y="184" width="170" height="22" rx="5" fill="url(#g)"/>
    <text x="384" y="201" font-size="17" font-weight="600" fill="#f6f8ff">30%</text>
    <text x="34" y="236" font-size="17" fill="#9aa4c4">10</text>
    <rect x="200" y="220" width="260" height="22" rx="5" fill="url(#g)"/>
    <text x="474" y="237" font-size="17" font-weight="600" fill="#f6f8ff">46%</text>
    <text x="34" y="272" font-size="17" fill="#9aa4c4">20</text>
    <rect x="200" y="256" width="356" height="22" rx="5" fill="url(#g)"/>
    <text x="570" y="273" font-size="17" font-weight="600" fill="#f6f8ff">64%</text>
    <text x="34" y="308" font-size="17" fill="#9aa4c4">50</text>
    <rect x="200" y="292" width="455" height="22" rx="5" fill="url(#g)"/>
    <text x="669" y="309" font-size="17" font-weight="600" fill="#f6f8ff">81%</text>
    <text x="34" y="344" font-size="17" fill="#9aa4c4">100</text>
    <rect x="200" y="328" width="502" height="22" rx="5" fill="url(#g)"/>
    <text x="716" y="345" font-size="17" font-weight="600" fill="#f6f8ff">90%</text>
    <text x="34" y="384" font-size="15" fill="#5b6b8d">With one turn left you must delete 92% of the history to break even, before any quality loss.</text>
  </g>
</svg>
